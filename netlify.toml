[build]
  command = "npm run build"
  publish = "dist"

# Proxy API requests to the Render backend to prevent CORS issues
[[redirects]]
  from = "/api/*"
  to = "https://cihen-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Fallback rule for React single page application routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
